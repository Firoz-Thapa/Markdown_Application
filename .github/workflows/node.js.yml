name: CI/CD Pipeline - GitHub Pages & Vercel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '18.x'

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Frontend Tests and Build
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test -- --coverage --watchAll=false
      
    - name: Build frontend
      if: ${{ secrets.REACT_APP_GEMINI_API_KEY != '' }}
      run: npm run build
      env:
        REACT_APP_GEMINI_API_KEY: ${{ secrets.REACT_APP_GEMINI_API_KEY }}
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        PUBLIC_URL: /markdown-workspace
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/build/
        retention-days: 1

  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: Backend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Create test database
      run: touch test-database.sqlite
        
    - name: Run database migrations
      if: ${{ secrets.JWT_SECRET != '' }}
      run: npm run migrate
      env:
        NODE_ENV: test
        JWT_SECRET: ${{ secrets.JWT_SECRET }}

  # Prepare for GitHub Pages deployment
  build-pages:
    needs: frontend-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/
        
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/

  # Deploy Frontend to GitHub Pages
  deploy-frontend:
    needs: build-pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # Deploy Backend to Vercel
  deploy-backend:
    needs: [frontend-test, backend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != ''
    defaults:
      run:
        working-directory: ./Backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install Vercel CLI
      run: npm install -g vercel@latest
      
    - name: Deploy to Vercel
      run: |
        vercel --token "$VERCEL_TOKEN" --yes --prod
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Health Checks
  health-check:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.BACKEND_PRODUCTION_URL != ''
    
    steps:
    - name: Wait for deployments to stabilize
      run: sleep 60
      
    - name: Check Backend Health
      run: |
        echo "Checking backend health..."
        BACKEND_URL="${{ secrets.BACKEND_PRODUCTION_URL }}"
        response=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health")
        if [ $response -eq 200 ]; then
          echo "Backend is healthy (HTTP $response)"
        else
          echo "Backend returned HTTP $response"
        fi
        
    - name: Check Frontend Deployment
      run: |
        echo "Checking frontend deployment..."
        response=$(curl -s -o /dev/null -w "%{http_code}" https://firoz-thapa.github.io/markdown-workspace)
        if [ $response -eq 200 ]; then
          echo "Frontend is accessible (HTTP $response)"
        else
          echo "Frontend returned HTTP $response"
        fi

  # Success Notification
  notify-success:
    needs: [health-check]
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deployment Success Notification
      run: |
        echo "Deployment Completed Successfully!"
        echo ""
        echo "Frontend URL: https://firoz-thapa.github.io/markdown-workspace"
        echo "Backend URL: ${{ secrets.BACKEND_PRODUCTION_URL }}"
        echo ""
        echo "Your Markdown Workspace is now live!"
        echo ""
        echo "Platform Details:"
        echo "   - Frontend: GitHub Pages (Free)"
        echo "   - Backend: Vercel Serverless (Free)"
        echo "   - Database: SQLite (File-based)"
        echo ""
        echo "Features available:"
        echo "   - Markdown editing with live preview"
        echo "   - Math equation support"
        echo "   - Document management"
        echo "   - User authentication"
        echo "   - Dark/Light theme"

  # Failure Notification
  notify-failure:
    needs: [frontend-test, backend-test, deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deployment Failure Notification
      run: |
        echo "Deployment Failed!"
        echo ""
        echo "Please check the logs above for details."
        echo "Common issues:"
        echo "- Missing GitHub secrets"
        echo "- Vercel authentication problems"
        echo "- Build errors in frontend/backend"
        echo ""
        echo "Check your secrets:"
        echo "- VERCEL_TOKEN"
        echo "- VERCEL_ORG_ID"
        echo "- VERCEL_PROJECT_ID"
        echo "- REACT_APP_GEMINI_API_KEY"
        echo "- JWT_SECRET"